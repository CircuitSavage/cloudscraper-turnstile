[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudscraper-turnstile"
version = "0.2.0"
description = "cloudscraper drop-in that actually solves Cloudflare Turnstile and the 5s interstitial via the Peak API. Subclasses requests.Session; swap two lines and your existing scraper works."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Peak" }]
keywords = [
  "cloudscraper",
  "cloudscraper-alternative",
  "cloudflare",
  "cloudflare-bypass",
  "turnstile",
  "cloudflare-turnstile",
  "captcha",
  "captcha-solver",
  "scraper",
  "web-scraping",
  "requests",
  "bypass",
  "403",
  "anti-bot",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["requests>=2.25"]

[project.urls]
Homepage = "https://peak.fo/?utm_source=github&utm_medium=readme&utm_campaign=packages&utm_content=cloudscraper-turnstile"
Documentation = "https://peak.fo/docs/turnstile?utm_source=github&utm_medium=readme&utm_campaign=packages&utm_content=cloudscraper-turnstile"
Pricing = "https://peak.fo/pricing?utm_source=github&utm_medium=readme&utm_campaign=packages&utm_content=cloudscraper-turnstile"
Source = "https://github.com/CircuitSavage/cloudscraper-turnstile"

[tool.hatch.build.targets.wheel]
packages = ["cloudscraper_turnstile"]

[tool.hatch.build.targets.sdist]
include = [
  "cloudscraper_turnstile",
  "examples",
  "tests",
  "assets",
  "README.md",
  "LICENSE",
  "TEST.md",
]
